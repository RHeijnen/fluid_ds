name: SSR hydration

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ssr-hydration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fluid-ds/ssr-tests exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:ssr-browser
        env:
          FLUID_BROWSERS: all
      - run: pnpm test:ssr-request-time
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssr-hydration-report
          path: |
            apps/ssr-tests/playwright-report
            apps/ssr-tests/test-results
            quality/evidence/framework-next-request-time
