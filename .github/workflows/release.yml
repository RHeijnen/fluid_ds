name: release

on:
  push:
    branches: [main]

# Don't compete with verify on the same SHA, let it finish first.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Changesets, version + publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # needed so changesets can push the version PR
      pull-requests: write
      id-token: write   # needed for npm provenance
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # changesets reads tags

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # npm 11.5.1+ is required for OIDC trusted publishing.
      - name: Setup npm with trusted publishing support
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # The changesets action does both of the following, depending on
      # whether there are pending changeset files in the repo:
      #
      #   1. If there are unreleased changesets, open (or update) a PR
      #      titled "Version Packages". Merging that PR bumps versions
      #      and writes CHANGELOG entries.
      #   2. If the merge that triggered this run was the Version Packages
      #      PR, run `publish` to push the bumped packages to npm.
      #
      # Stable packages are published to npm's default `latest` dist-tag.
      # Prerelease versions remain identifiable by their semver suffix.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish --tag latest
          version: pnpm exec changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
