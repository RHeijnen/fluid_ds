name: release

on:
  push:
    branches: [main]
  # Runnable by hand as well. A push that does not reach the event -- pushed
  # with a token whose events do not re-trigger workflows, for instance --
  # otherwise leaves a version sitting on main, committed and unpublished, with
  # no way to release it but another push that may not fire either.
  workflow_dispatch:

# Serialize release attempts. Verification dependencies below enforce ordering.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release-context:
    name: Require the main release context
    runs-on: ubuntu-latest
    steps:
      - run: test "$GITHUB_REF" = "refs/heads/main"

  # Local reusable references and default checkout use this event's exact commit.
  # Manual dispatch runs the same gates; missing push events cannot bypass them.
  # Two suites intentionally do NOT gate publishing yet. Both still run on
  # every push through their own workflow triggers, so their signal stays
  # visible; they rejoin this needs-list once they hold a green baseline:
  #   - visual-regression.yml: 175 accepted-baseline diffs await the owner's
  #     canonical-environment review (baseline refresh policy requires human
  #     approval; an unreviewable backlog vetoes releases without informing
  #     them).
  #   - ssr-hydration.yml: engine-specific browser-spec failures (otp on
  #     Chromium, date-range-picker on Firefox) have never passed in CI and
  #     need a stabilization pass.
  verify:
    needs: release-context
    uses: ./.github/workflows/verify.yml
  coverage:
    needs: release-context
    uses: ./.github/workflows/coverage.yml
  accessibility:
    needs: release-context
    uses: ./.github/workflows/accessibility.yml
  interactions:
    needs: release-context
    uses: ./.github/workflows/storybook-interactions.yml
  performance:
    needs: release-context
    uses: ./.github/workflows/performance.yml
  packages:
    needs: release-context
    uses: ./.github/workflows/package-contracts.yml
  frameworks:
    needs: release-context
    uses: ./.github/workflows/framework-contracts.yml

  release:
    name: Changesets, version + publish
    needs: [verify, coverage, accessibility, interactions, performance, packages, frameworks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # needed so changesets can push the version PR
      pull-requests: write
      id-token: write # needed for npm provenance
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # changesets reads tags

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # npm 11.5.1+ is required for OIDC trusted publishing.
      - name: Setup npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Offline supply-chain guard
        run: pnpm check:supply-chain

      - name: Build packages
        run: pnpm build

      - name: Offline release integrity dry-run
        run: pnpm publish:dry

      # The changesets action does both of the following, depending on
      # whether there are pending changeset files in the repo:
      #
      #   1. If there are unreleased changesets, open (or update) a PR
      #      titled "Version Packages". Merging that PR bumps versions
      #      and writes CHANGELOG entries.
      #   2. If the merge that triggered this run was the Version Packages
      #      PR, run `publish` to push the bumped packages to npm.
      #
      # The dist-tag is never hardcoded here. `scripts/changeset-publish.mjs`
      # reads `.changeset/pre.json` and resolves it at run time: a stable
      # release publishes `--tag latest`, while changesets pre-mode publishes
      # under the prerelease tag that `changeset pre enter` recorded. A release
      # candidate can therefore never take npm's `latest` dist-tag.
      - name: Reject an unverified or superseded release checkout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          release_tip="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$release_tip" != "$GITHUB_SHA" ]; then
            echo "Main moved after this release started. Run the gates for the new commit."
            exit 1
          fi

      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: node scripts/changeset-publish.mjs
          version: pnpm exec changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
