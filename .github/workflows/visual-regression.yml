# Visual regression for Fluid.
#
# Strategy: option A from the design notes, only run when component code
# changed. The baseline PNGs in `apps/visual-regression/__screenshots__/`
# are committed to the repo and are the source of truth. CI diffs against
# them; on failure, the Playwright HTML report (with side-by-side actual /
# expected / diff images) is uploaded as an artifact and a comment is
# posted on the PR with the link + instructions to refresh baselines.
#
# Baselines are generated on a developer machine via
# `pnpm test:visual:update` and committed alongside the change.

name: Visual regression

on:
  workflow_call:
  pull_request:
    paths:
      - "packages/**"
      - "apps/a11y/scripts/fixture-selection.mjs"
      - "apps/a11y/tests/fixture-helpers.ts"
      - "quality/component-quality.json"
      - "pnpm-lock.yaml"
      - "apps/storybook/**"
      - "apps/visual-regression/**"
      - ".github/workflows/visual-regression.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/a11y/scripts/fixture-selection.mjs"
      - "apps/a11y/tests/fixture-helpers.ts"
      - "quality/component-quality.json"
      - "pnpm-lock.yaml"
      - "apps/storybook/**"
      - "apps/visual-regression/**"
      - ".github/workflows/visual-regression.yml"

permissions:
  contents: read

jobs:
  visual:
    name: Snapshot diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          # We don't enable pnpm cache here because the action needs a
          # pnpm version pinned via packageManager, corepack picks it up.

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install workspace
        run: corepack pnpm install --frozen-lockfile

      - name: Build packages
        run: corepack pnpm build

      - name: Build Storybook
        run: corepack pnpm --filter @fluid-ds/storybook build

      - name: Install Playwright browsers
        working-directory: apps/visual-regression
        run: corepack pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Check visual fixture selection
        working-directory: apps/visual-regression
        run: corepack pnpm run test:fixtures

      - name: Generate visual fixtures
        working-directory: apps/visual-regression
        run: corepack pnpm run generate

      - name: Check browser fixture guards
        working-directory: apps/visual-regression
        run: corepack pnpm run test:guards

      - name: Run visual regression
        id: vr
        working-directory: apps/visual-regression
        run: corepack pnpm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/visual-regression/playwright-report/
          retention-days: 14

      - name: Upload diff snapshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diffs
          path: apps/visual-regression/test-results/
          retention-days: 14

  comment:
    name: Report visual failure
    needs: visual
    if: always() && needs.visual.result == 'failure' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # This privileged job never checks out or executes pull-request content.
      - name: Comment on PR with diff link
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### Visual verification failed',
              '',
              `The visual checks in [\`apps/visual-regression\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/tree/${context.sha}/apps/visual-regression) did not complete successfully. Inspect the failed step: causes include setup errors, missing or invalid fixtures, absent baselines, and pixel differences.`,
              '',
              `- **Playwright report (side-by-side actual vs expected vs diff):** download the \`playwright-report\` artifact from [this run](${runUrl}) and open \`index.html\`.`,
              `- **Raw diff images:** download the \`visual-diffs\` artifact.`,
              '',
              'Only refresh baselines after reviewing the actual images in the canonical environment and obtaining the required approval. A missing fixture or setup error is not a reason to update snapshots:',
              '',
              '```bash',
              'corepack pnpm --filter @fluid-ds/storybook build',
              'corepack pnpm --filter @fluid-ds/visual-regression test:update',
              'git add apps/visual-regression/__screenshots__',
              'git commit -m "test(visual): refresh baselines"',
              '```',
              '',
              'Keep unexpected differences and infrastructure failures visible until their cause is fixed; do not accept snapshots merely to make the job green.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
